<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora | Projeto 4</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <main class="calculator-container">

        <div class="calculator">

            <div class="top">

                <div>
                    <p class="small-title">PROJETO 04</p>
                    <h1>Calculadora</h1>
                </div>

                <div class="logo">
                    &lt;/&gt;
                </div>

            </div>

            <div class="display">

                <div id="previous-operation"></div>

                <div id="current-operation">
                    0
                </div>

            </div>

            <div class="buttons">

                <button class="button clear" data-action="clear">
                    AC
                </button>

                <button class="button operator" data-action="delete">
                    DEL
                </button>

                <button class="button operator" data-operation="%">
                    %
                </button>

                <button class="button operator" data-operation="/">
                    ÷
                </button>


                <button class="button" data-number="7">
                    7
                </button>

                <button class="button" data-number="8">
                    8
                </button>

                <button class="button" data-number="9">
                    9
                </button>

                <button class="button operator" data-operation="*">
                    ×
                </button>


                <button class="button" data-number="4">
                    4
                </button>

                <button class="button" data-number="5">
                    5
                </button>

                <button class="button" data-number="6">
                    6
                </button>

                <button class="button operator" data-operation="-">
                    −
                </button>


                <button class="button" data-number="1">
                    1
                </button>

                <button class="button" data-number="2">
                    2
                </button>

                <button class="button" data-number="3">
                    3
                </button>

                <button class="button operator" data-operation="+">
                    +
                </button>


                <button class="button zero" data-number="0">
                    0
                </button>

                <button class="button" data-number=".">
                    .
                </button>

                <button class="button equals" data-action="calculate">
                    =
                </button>

            </div>

            <div class="footer">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
