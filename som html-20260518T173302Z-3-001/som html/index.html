<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSlider - Preserve a Natureza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Preserve nosso Planeta 🌏</h1>
        <p id="descricao">A natureza floresce quando cuidamos dela.</p>

        <div class="moldura-container">
            <img id="foto-natureza" src="https://images.pexels.com/photos/1133957/pexels-photo-1133957.jpeg?auto=compress&cs=tinysrgb&w=600" 
            alt="Natureza">
        </div>

        <div class="controles">
            <button id="btn-alterar">Alterar Cenário</button>
            <button id="btn-som">🔊 Ouvir a Natureza</button>
        </div>
    </div>

    <audio id="musica" src="som de natureza.mp3" loop></audio>

    <script src="main.js"></script>
</body>
</html>
